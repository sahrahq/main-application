name: CI

# ENGINEERING-STANDARDS.md §8. If this is not required to merge, none of the
# standards in that document are real.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    # Linux ONLY, and deliberately. Font rasterization differs across
    # platforms, so a golden generated on macOS or Windows fails here for
    # reasons that have nothing to do with the design. One OS owns the goldens.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # PINNED, AND THE PIN IS LOAD-BEARING.
      #
      # `channel: stable` with no version meant the goldens were bound to
      # whatever Flutter shipped most recently — so all 430 could turn red with
      # no commit of ours, and nothing to bisect. Every committed PNG was
      # regenerated on 2026-08-10 against exactly this version.
      #
      # BUMPING THIS REQUIRES REGENERATING THE GOLDENS in the same commit. See
      # ENGINEERING-STANDARDS.md §3: 410 of 430 changed on a platform move, and
      # an engine change is the same class of event.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7

      - name: Design tokens are current
        working-directory: packages/sahra_design_system
        run: dart run tool/generate_tokens.dart --check

      - name: Shared lint scanners
        working-directory: packages/sahra_lints
        run: dart pub get && dart analyze --fatal-infos

      - name: API client is generated and current
        working-directory: packages/sahra_api_client
        run: |
          dart pub get
          dart analyze --fatal-infos
          # Regenerates from the committed spec and diffs. Generated output is
          # NOT formatted — see the package README.
          dart test

      - name: Shared copy — ARB parity and backend error coverage
        working-directory: packages/sahra_localization
        run: dart pub get && dart test

      - name: Design system
        working-directory: packages/sahra_design_system
        run: |
          flutter pub get
          flutter analyze --fatal-infos --fatal-warnings
          # Generated output is EXCLUDED: formatting it would rewrite the
          # layout the generator produced, and the drift test would then
          # correctly report tampering.
          dart format --set-exit-if-changed --line-length 100             lib/src/components lib/src/theme lib/src/gallery             lib/sahra_design_system.dart test tool
          flutter test
          flutter test --tags golden

      - name: Customer app
        working-directory: apps/customer_app
        run: |
          flutter pub get
          # Generated: providers (riverpod_generator), ARB merge, gen-l10n.
          # All three are COMMITTED and drift-checked, same as tokens.g.dart.
          dart run tool/merge_arb.dart --check
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          git diff --exit-code -- lib/localization lib/**/*.g.dart
          flutter analyze --fatal-infos --fatal-warnings
          # `--tags live` is EXCLUDED: those need a running API and a seeded
          # database. They are the developer's end-to-end check, not CI's.
          flutter test --exclude-tags live
          flutter test --tags golden

      # Uploaded only on failure, so a golden diff can be LOOKED AT rather than
      # guessed at. A pixel diff nobody can see is a dead end.
      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: packages/**/test/**/failures/**
          if-no-files-found: ignore

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sahra_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['6379:6379']
      # HEALTH-GATED like the other two. It was the only service without a
      # check, and the consequence was not a red build — `test/global-setup.ts`
      # answers an unreachable Meilisearch with a SKIP, so the search suites
      # would quietly not run and the job would still go green.
      #
      # Two independent fixes, because either alone is insufficient: this gate
      # stops the race happening, and global-setup now THROWS instead of
      # skipping when `CI` is set, so if it ever happens anyway it is loud.
      # A gate with no alarm behind it is a gate you stop checking.
      #
      # The command is the one the repo's own docker-compose.yml uses and which
      # reports `healthy` on a running container — not a guess about what is
      # installed in the image.
      meilisearch:
        image: getmeili/meilisearch:v1.11
        env:
          MEILI_ENV: development
        options: >-
          --health-cmd "curl -f http://localhost:7700/health"
          --health-interval 5s --health-timeout 3s --health-retries 12
        ports: ['7700:7700']
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sahra_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/sahra_test
      REDIS_URL: redis://localhost:6379
      MEILISEARCH_HOST: http://localhost:7700
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - working-directory: apps/api
        run: pnpm install --frozen-lockfile

      # ── THE CI DATABASE IS NOT SUPABASE, AND THE MIGRATIONS ASSUME IT IS ──
      #
      # `20260801000000_lock_down_data_api` revokes from `anon` and
      # `authenticated`. Those roles are not ours — SUPABASE creates them, and
      # they are the whole reason that migration exists: they are the identities
      # PostgREST authenticates the public publishable key as. The image above
      # is plain `postgis/postgis`, where they do not exist, and Postgres
      # answers `REVOKE ... FROM anon` with `42704: role "anon" does not exist`
      # rather than shrugging.
      #
      # Found on 2026-08-10, when this branch went through CI for the first
      # time at 33 commits. It failed at migration 2 of 14 — meaning the
      # pipeline had never once applied this schema, on this branch OR on main.
      #
      # THE ROLES ARE CREATED HERE, AND THE MIGRATION IS NOT WEAKENED. Guarding
      # the REVOKE with `IF EXISTS` would make it a no-op wherever the role is
      # absent — which is exactly the failure `20260809020000_no_silent_lapses`
      # was written about, where `REVOKE USAGE ON SCHEMA public` reported
      # success and changed nothing for a week. A lockdown that cannot fail is
      # not a lockdown. Creating the roles makes the CI database satisfy the
      # same contract Supabase does, so `rls-coverage.e2e-spec.ts` is asking a
      # real question instead of a vacuous one.
      #
      # NOLOGIN: these exist to be revoked FROM, never connected as.
      - name: Supabase-shaped roles
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN;"

      - name: Schema and guards
        working-directory: apps/api
        run: |
          pnpm prisma migrate deploy
          psql "$DATABASE_URL" -f prisma/sql/01_guards.sql

      - name: OpenAPI spec is current
        working-directory: apps/api
        # Boots the REAL app and diffs the document against the committed one.
        # If a controller can change without the spec changing, guarantee 1 is
        # theatre — so this runs against live services, like the e2e suite.
        run: pnpm openapi:export --check

      - name: Build, unit, e2e
        working-directory: apps/api
        run: |
          pnpm exec tsc -p tsconfig.json --noEmit
          pnpm exec nest build
          pnpm exec jest
          pnpm exec jest --config ./test/jest-e2e.json --runInBand
