name: sahra_design_system
description: SAHRA design tokens and theme — generated from docs/design/tokens.json.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  # Part of the Flutter SDK, not a third-party package. Required, not optional:
  # without the global delegates an `ar` locale still lays out left-to-right,
  # because DefaultWidgetsLocalizations only knows English. Caught by
  # theme_test.dart.
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  sahra_lints:
    path: ../sahra_lints
  sahra_test_harness:
    path: ../sahra_test_harness
  flutter_lints: ^5.0.0

flutter:
  # All four families are SIL Open Font License; each ships its OFL-*.txt
  # alongside the .ttf in fonts/. font_assets_test.dart fails if a family named
  # in tokens.json is missing here, because Flutter does NOT error on an
  # unknown family — it silently substitutes the platform font, and an Arabic
  # screen in Roboto looks fine to anyone not reading it closely.
  fonts:
    # Latin UI.
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Light.ttf
          weight: 300
        - asset: fonts/Poppins-Regular.ttf
          weight: 400
        - asset: fonts/Poppins-Medium.ttf
          weight: 500
        - asset: fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: fonts/Poppins-Bold.ttf
          weight: 700

    # Arabic UI — the three weights SahraTypography actually uses: body 400,
    # labels 500, headings 600. Static faces, so `weight:` selects the file.
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600

    # Arabic display and Latin display ship as VARIABLE fonts. Declaring one
    # file under several `weight:` keys would not interpolate the axis —
    # Flutter selects an asset, it does not set `wght`. One asset each; the
    # weight is applied with FontVariation in SahraTypography.
    - family: Reem Kufi
      fonts:
        - asset: fonts/ReemKufi-Variable.ttf
    - family: Newsreader
      fonts:
        - asset: fonts/Newsreader-Variable.ttf
