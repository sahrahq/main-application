name: sahra_design_system
description: SAHRA design tokens and theme — generated from docs/design/tokens.json.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  # Part of the Flutter SDK, not a third-party package. Required, not optional:
  # without the global delegates an `ar` locale still lays out left-to-right,
  # because DefaultWidgetsLocalizations only knows English. Caught by
  # theme_test.dart.
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  fonts:
    # Only Poppins ships in docs/design/assets/fonts today. The Arabic families
    # (IBM Plex Sans Arabic, Reem Kufi) and the Latin display face (Newsreader)
    # are named by the tokens but have no files in the repo, so they currently
    # fall back to the platform default. See README — this is a known gap, not
    # a decision.
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Light.ttf
          weight: 300
        - asset: fonts/Poppins-Regular.ttf
          weight: 400
        - asset: fonts/Poppins-Medium.ttf
          weight: 500
        - asset: fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: fonts/Poppins-Bold.ttf
          weight: 700
