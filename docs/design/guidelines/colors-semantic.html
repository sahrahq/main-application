<!-- @dsCard group="Colors" viewport="700x150" name="Semantic" subtitle="Success / warning / error — warm-shifted" -->
<!DOCTYPE html><html><head><meta charset="UTF-8"><title>card</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--surface-page);color:var(--text-body)}.wrap{padding:20px;display:flex;gap:12px;align-items:stretch;flex-wrap:wrap}.sw{flex:1;min-width:90px;border-radius:var(--radius-md);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;min-height:80px}.sw b{font-size:12px;font-weight:600}.sw code{font-size:10px;opacity:.75;font-family:var(--font-mono)}</style></head><body><div class="wrap"><div class="sw" style="background:var(--success);color:#FDFBF7"><b>success</b><code>#4C7A4F</code></div><div class="sw" style="background:var(--warning);color:#FDFBF7"><b>warning</b><code>#C48A4B</code></div><div class="sw" style="background:var(--error);color:#FDFBF7"><b>error</b><code>#B3412A</code></div></div></body></html>
