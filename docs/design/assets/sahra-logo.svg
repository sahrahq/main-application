<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="warm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded square background -->
  <rect width="800" height="800" rx="120" fill="url(#bgGrad)"/>

  <!-- Subtle border glow -->
  <rect x="16" y="16" width="768" height="768" rx="108" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.15"/>

  <!-- Clean S letterform -->
  <text x="400" y="500" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="380" font-weight="700" fill="url(#warm)">S</text>

  <!-- Thin echo outline of S -->
  <text x="400" y="500" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="380" font-weight="700" fill="none" stroke="#faf7f2" stroke-width="1" opacity="0.1">S</text>

  <!-- SAHRA text -->
  <text x="400" y="735" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" fill="#faf7f2" letter-spacing="18">SAHRA</text>
</svg>
